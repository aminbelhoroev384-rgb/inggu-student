<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вход — ИнгГУ Student</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 24px;
    padding: 35px;
    box-shadow: 0 25px 60px rgba(0,0,0,.25);
}

.logo {
    width: 58px;
    height: 58px;
    border-radius: 17px;
    background: linear-gradient(135deg,#3b82f6,#6366f1);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: 800;
    margin-bottom: 20px;
}

h1 {
    color: #101828;
    font-size: 27px;
    margin-bottom: 8px;
}

.subtitle {
    color: #667085;
    font-size: 14px;
    margin-bottom: 28px;
}

label {
    display: block;
    color: #344054;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d0d5dd;
    border-radius: 11px;
    outline: none;
    font-size: 15px;
    margin-bottom: 17px;
}

input:focus {
    border-color: #4f8cff;
    box-shadow: 0 0 0 3px rgba(79,140,255,.12);
}

button {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 11px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
}

.error {
    display: none;
    background: #fef3f2;
    color: #b42318;
    padding: 11px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
}

.footer {
    text-align: center;
    color: #98a2b3;
    font-size: 12px;
    margin-top: 22px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">И</div>

    <h1>ИнгГУ Student</h1>

    <p class="subtitle">
        Войдите в свой аккаунт
    </p>

    <div class="error" id="error">
        Неверный логин или пароль
    </div>

    <form method="POST" action="/login">

        <label for="login">
            Логин
        </label>

        <input
            type="text"
            id="login"
            name="login"
            placeholder="Введите логин"
            required
        >

        <label for="password">
            Пароль
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Введите пароль"
            required
        >

        <button type="submit">
            Войти
        </button>

    </form>

    <div class="footer">
        Ингушский государственный университет
    </div>

</div>

</body>
</html>
